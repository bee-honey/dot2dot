[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dot2dot"
version = "0.1.0"
description = "Turn any photo into a printable connect-the-dots puzzle."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "reportlab>=4.0",
    "scikit-image>=0.22",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "pillow-heif>=0.16",
    "rembg>=2.0.50",
    "onnxruntime>=1.17",
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Local CLIP judge (free, offline guess test). Large: PyTorch + a ~600 MB model.
clip = ["torch>=2.2", "open_clip_torch>=2.24"]

[project.scripts]
dot2dot = "dot2dot.cli:main"
dot2dot-web = "dot2dot.web.app:main"

[tool.setuptools.packages.find]
include = ["dot2dot*"]

[tool.setuptools.package-data]
"dot2dot.web" = ["static/*"]
"dot2dot" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
